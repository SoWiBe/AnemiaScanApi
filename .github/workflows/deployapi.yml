name: Deploy AnemiaScanApi

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-master
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    environment: Master
    timeout-minutes: 30
    env:
      DEPLOY_HOST: ${{ secrets.VPS_HOST }}
      DEPLOY_USER: ${{ secrets.VPS_USERNAME }}
      DEPLOY_PORT: ${{ vars.VPS_PORT || '22' }}
    steps:
      - name: Check build license
        env:
          LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}
        run: |
          if [ -z "$LICENSE_KEY" ]; then
            echo 'Add SIXLABORS_LICENSE_KEY to the Master environment secrets.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test
        run: dotnet test AnemiaScanApi.sln -c Debug
      - name: Publish
        env:
          SixLaborsLicenseKey: ${{ secrets.SIXLABORS_LICENSE_KEY }}
        run: dotnet publish AnemiaScanApi/AnemiaScanApi.csproj -c Release -r linux-x64 --self-contained false -o publish
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER"
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Upload
        run: |
          tar -czf api.tar.gz -C publish .
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -P "$DEPLOY_PORT" api.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/var/tmp/anemiascan-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
      - name: Deploy and check readiness
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" <<'REMOTE'
          set -euo pipefail
          release="$1"
          archive="/var/tmp/anemiascan-${release}.tar.gz"
          trap 'rm -f "$archive"' EXIT
          chmod 644 "$archive"
          previous=$(readlink /var/lib/anemiascan/current || true)
          sudo -n -u anemiascan /usr/bin/bash -s -- "$release" "$archive" <<'APP'
          set -euo pipefail
          target="/var/lib/anemiascan/releases/$1"
          mkdir "$target"
          tar --no-same-owner -xzf "$2" -C "$target"
          test -s "$target/AnemiaScanApi.dll"
          ln -s "$target" /var/lib/anemiascan/current.next
          mv -Tf /var/lib/anemiascan/current.next /var/lib/anemiascan/current
          APP
          sudo -n /usr/bin/systemctl restart anemiascan-api
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 5 http://127.0.0.1:5000/health/ready; then
              echo 'Readiness passed'
              exit 0
            fi
            sleep 2
          done
          echo 'Readiness failed; restoring previous release'
          if [ -n "$previous" ]; then
            sudo -n -u anemiascan /usr/bin/bash -s -- "$previous" <<'ROLLBACK'
          set -euo pipefail
          ln -s "$1" /var/lib/anemiascan/current.rollback
          mv -Tf /var/lib/anemiascan/current.rollback /var/lib/anemiascan/current
          ROLLBACK
            sudo -n /usr/bin/systemctl restart anemiascan-api
          fi
          exit 1
          REMOTE
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
