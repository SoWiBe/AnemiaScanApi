name: Deploy AnemiaScanApi

on:
  push:
    branches: [ "master" ] # Авто-деплой при пуше в master
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: 'AnemiaScanApi/AnemiaScanApi.csproj'
  ARTIFACT_NAME: 'anemiascan-publish'
  VPS_DEPLOY_PATH: '/var/www/anemiascan-api'
  SERVICE_NAME: 'anemiascan-api'
  SERVICE_USER: 'anemiascan'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: Master 
    steps:
      - uses: actions/checkout@v4

      - name: Debug secrets
        run: |
          echo "host: ${{ secrets.VPS_HOST != '' }}"
          echo "user: ${{ secrets.VPS_USERNAME != '' }}"
          echo "key:  ${{ secrets.VPS_SSH_KEY != '' }}"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Publish
        # Собираем сразу под Linux x64
        run: dotnet publish ${{ env.PROJECT_PATH }} -c Release -r linux-x64 --self-contained false -o ./publish

      - name: Create deployment artifact
        run: tar -czvf ${{ env.ARTIFACT_NAME }}.tar.gz -C ./publish .

      - name: Copy artifact to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "${{ env.ARTIFACT_NAME }}.tar.gz"
          target: "/tmp"

      - name: Extract and Restart Service
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail

            echo "0. Обеспечиваем наличие сервисного пользователя..."
            id ${{ env.SERVICE_USER }} &>/dev/null || sudo useradd -r -s /usr/sbin/nologin ${{ env.SERVICE_USER }}

            echo "1. Останавливаем сервис..."
            sudo systemctl stop ${{ env.SERVICE_NAME }} 2>/dev/null || true

            echo "2. Подготовка папок..."
            sudo mkdir -p ${{ env.VPS_DEPLOY_PATH }}
            [ -n "${{ env.VPS_DEPLOY_PATH }}" ] && sudo rm -rf ${{ env.VPS_DEPLOY_PATH }}/*

            echo "3. Распаковка..."
            sudo tar -xzf /tmp/${{ env.ARTIFACT_NAME }}.tar.gz -C ${{ env.VPS_DEPLOY_PATH }}

            echo "4. Создание .env файла..."
            sudo tee ${{ env.VPS_DEPLOY_PATH }}/.env >/dev/null <<'EOF'
            ASPNETCORE_ENVIRONMENT=Production
            ASPNETCORE_URLS=http://localhost:5000
            JwtSettings__Secret=${{ secrets.JWT_SECRET }}
            JwtSettings__Issuer=${{ secrets.JWT_ISSUER }}
            JwtSettings__Audience=${{ secrets.JWT_AUDIENCE }}
            JwtSettings__AccessTokenExpirationMinutes=${{ secrets.JWT_ACCESS_MIN }}
            JwtSettings__RefreshTokenExpirationDays=${{ secrets.JWT_REFRESH_DAYS }}
            EmailSender__Email=${{ secrets.EMAIL_SENDER }}
            EmailSender__Password=${{ secrets.EMAIL_PASSWORD }}
            Smtp__Server=${{ secrets.SMTP_SERVER }}
            Smtp__Port=${{ secrets.SMTP_PORT }}
            MongoDB__DatabaseName=${{ secrets.MONGODB_DB_NAME }}
            MongoDB__ConnectionString=${{ secrets.MONGODB_CONNECTION }}
            MongoDB__Collections__Users=${{ secrets.MONGODB_COL_USERS }}
            MongoDB__Collections__Analyses=${{ secrets.MONGODB_COL_ANALYSES }}
            CodeGenerator__Length=${{ secrets.CODE_GEN_LENGTH }}
            CodeGenerator__Chars=${{ secrets.CODE_GEN_CHARS }}
            CodeGenerator__CacheKey=${{ secrets.CODE_GEN_CACHE_KEY }}
            EOF

            echo "5. Настройка Systemd сервиса..."
            sudo tee /etc/systemd/system/${{ env.SERVICE_NAME }}.service >/dev/null <<'EOF'
            [Unit]
            Description=Anemia Scan ML API
            After=network.target

            [Service]
            WorkingDirectory=${{ env.VPS_DEPLOY_PATH }}
            ExecStart=/usr/bin/dotnet ${{ env.VPS_DEPLOY_PATH }}/AnemiaScanApi.dll
            Restart=always
            RestartSec=10
            EnvironmentFile=${{ env.VPS_DEPLOY_PATH }}/.env
            User=${{ env.SERVICE_USER }}
            # Ограничение памяти, чтобы 1ГБ сервер не завис
            MemoryMax=700M
            MemoryAccounting=true

            [Install]
            WantedBy=multi-user.target
            EOF

            echo "6. Права и запуск..."
            sudo chown -R ${{ env.SERVICE_USER }}:${{ env.SERVICE_USER }} ${{ env.VPS_DEPLOY_PATH }}
            sudo chmod 600 ${{ env.VPS_DEPLOY_PATH }}/.env
            sudo systemctl daemon-reload
            sudo systemctl enable ${{ env.SERVICE_NAME }}
            sudo systemctl restart ${{ env.SERVICE_NAME }}
            sudo rm -f /tmp/${{ env.ARTIFACT_NAME }}.tar.gz

            echo "✅ Готово! Проверка статуса:"
            sudo systemctl status ${{ env.SERVICE_NAME }} --no-pager
