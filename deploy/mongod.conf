# MongoDB на том же VPS, что и API (вариант B в docs/plans/MVP_PLAN.md).
# Ставится в /etc/mongod.conf. После правки: sudo systemctl restart mongod
#
# Главное здесь — cacheSizeGB. По умолчанию WiredTiger берёт 50% от (RAM - 1GB),
# то есть на машине с 6 ГБ он claim-ит ~2.5 ГБ. Вместе с API, которому в
# systemd-юните отдано MemoryMax=2500M под TensorFlow-рантайм, это гарантированный
# OOM под нагрузкой. Бюджет памяти на 6 ГБ (тариф NVMe-VPS-E, GoodHost):
#   API (TF + ONNX + ImageSharp)  ~2.5 ГБ  (жёсткий потолок в systemd)
#   mongod (кэш 1 ГБ + оверхед)   ~1.5 ГБ
#   ОС, nginx, логи               ~0.5 ГБ
#   ---------------------------------------
#   свободно под page cache       ~1.5 ГБ
#
# На 6 ГБ запас невелик, поэтому обязателен swap (см. DEPLOYMENT.md) — он даёт
# ядру куда деть холодные страницы вместо вызова OOM-killer.
#
# Если возьмёшь машину с другим объёмом RAM — пересчитай cacheSizeGB,
# а не оставляй как есть.

storage:
  dbPath: /var/lib/mongodb
  wiredTiger:
    engineConfig:
      cacheSizeGB: 1

systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log

net:
  port: 27017
  # Только localhost. API ходит в базу через loopback, наружу порт не смотрит
  # вообще — это единственная причина, по которой здесь можно жить без TLS.
  bindIp: 127.0.0.1

security:
  # Даже на loopback: любой процесс на машине иначе получает полный доступ к базе.
  authorization: enabled

operationProfiling:
  # Логировать запросы дольше 100 мс — пригодится, когда будем мерить время
  # ответа /analysis/anemia/prediction под нагрузкой (Фаза 4 плана).
  mode: slowOp
  slowOpThresholdMs: 100
